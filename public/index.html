<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#0b0e1a">
<title>Симулятор Лудамании</title>
<style>
  :root{
    --pink:#ff2d78; --purple:#7c4dff; --cyan:#00e5ff; --gold:#ffc93c;
    --bg:#0b0e1a; --card:rgba(255,255,255,.06); --line:rgba(255,255,255,.12);
    --green:#00e676; --red:#ff5252;
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
  html,body{margin:0; padding:0; height:100%;}
  body{ background:var(--bg); color:#fff; font-family:-apple-system,'Segoe UI',Roboto,Arial,sans-serif; overflow-x:hidden; user-select:none; }
  
  .blob{position:fixed; border-radius:50%; filter:blur(90px); opacity:.35; z-index:0; pointer-events:none; animation:float 12s ease-in-out infinite alternate;}
  .b1{width:60vw;height:60vw;background:#7c4dff;top:-20vw;left:-20vw;}
  .b2{width:50vw;height:50vw;background:#ff2d78;bottom:-18vw;right:-15vw;animation-delay:-4s;}
  .b3{width:40vw;height:40vw;background:#00e5ff;top:40%;left:55%;opacity:.18;animation-delay:-8s;}
  @keyframes float{from{transform:translate(0,0) scale(1)}to{transform:translate(6vw,-4vw) scale(1.15)}}

  #app{position:relative; z-index:1; width:100%; min-height:100dvh; display:none; flex-direction:column;}

  header{ position:sticky; top:0; z-index:10; padding:10px 14px calc(10px + env(safe-area-inset-top)); background:linear-gradient(180deg, rgba(11,14,26,.95), rgba(11,14,26,.75)); backdrop-filter:blur(10px); border-bottom:1px solid var(--line); display:flex; align-items:center; justify-content:space-between; gap:10px;}
  .head-right{display:flex; align-items:center; gap:8px;}
  .logo{font-weight:900; font-size:16px; letter-spacing:.5px; line-height:1.1; background:linear-gradient(90deg,var(--pink),var(--gold),var(--cyan)); -webkit-background-clip:text; background-clip:text; color:transparent; cursor:pointer;}
  .logo small{display:block; font-size:9px; letter-spacing:2px; color:#9aa; -webkit-text-fill-color:#9aa;}
  
  .balance-wrap{display:flex; align-items:center; gap:6px; background:rgba(255,255,255,.05); padding:4px 6px 4px 12px; border-radius:20px; border:1px solid var(--line);}
  .balance{font-weight:800; font-size:16px; color:var(--gold); transition:transform .2s;}
  .balance.pop{transform:scale(1.15);}
  .topup-btn{ width:24px; height:24px; border-radius:50%; border:none; background:linear-gradient(135deg,#00c853,#00e576); color:#fff; font-size:18px; font-weight:900; cursor:pointer; display:flex; align-items:center; justify-content:center; line-height:1; padding-bottom:2px; box-shadow:0 2px 10px rgba(0,230,118,.4);}

  main{flex:1; padding:14px 14px calc(90px + env(safe-area-inset-bottom));}
  .game{display:none; animation:slide .25s ease;}
  .game.on{display:block;}
  @keyframes slide{from{opacity:0; transform:translateX(14px)}to{opacity:1; transform:none}}

  .live-badge{ display:inline-flex; align-items:center; gap:6px; background:rgba(0,230,118,.12); border:1px solid rgba(0,230,118,.3); color:#fff; font-size:11px; font-weight:800; padding:4px 10px; border-radius:12px;}
  .live-dot{width:6px; height:6px; background:var(--green); border-radius:50%; box-shadow:0 0 8px var(--green); animation:pulse 1.5s infinite;}
  @keyframes pulse{0%,100%{opacity:1; transform:scale(1)}50%{opacity:.4; transform:scale(.7)}}

  .menu-title{text-align:center; font-size:24px; font-weight:900; margin-bottom:16px; letter-spacing:1px; color:#fff;}
  .menu-grid{display:grid; grid-template-columns:1fr 1fr; gap:12px;}
  .menu-card{ position:relative; aspect-ratio: 1/1.1; border-radius:20px; border:1px solid rgba(255,255,255,.1); background:linear-gradient(160deg, var(--c1), var(--c2)); display:flex; flex-direction:column; justify-content:flex-end; align-items:flex-start; padding:16px; cursor:pointer; transition:transform .1s; overflow:hidden; box-shadow:0 8px 24px -8px var(--c2);}
  .menu-card:active{transform:scale(.95);}
  .menu-card::before{ content:''; position:absolute; inset:0; background:radial-gradient(circle at top right, rgba(255,255,255,.3), transparent 60%); z-index:0;}
  .menu-card .title{font-size:20px; font-weight:900; z-index:2; text-shadow:0 2px 10px rgba(0,0,0,.6); margin-top:8px; color: #fff;}
  .menu-card .icon{font-size:56px; position:absolute; top:15px; right:15px; z-index:1; filter:drop-shadow(0 4px 8px rgba(0,0,0,.4));}
  .menu-live{ position:absolute; top:12px; left:12px; z-index:3; background:rgba(0,0,0,.5); backdrop-filter:blur(4px); padding:5px 10px; border-radius:12px; display:flex; align-items:center; gap:6px; font-size:11px; font-weight:800; border:1px solid rgba(255,255,255,.1); color: #fff;}

  .panel{background:var(--card); border:1px solid var(--line); border-radius:18px; padding:14px; margin-bottom:12px; box-shadow:0 8px 30px rgba(0,0,0,.35);}
  .ptitle{font-size:12px; letter-spacing:1.5px; color:#9ab; text-transform:uppercase; margin:0 0 10px; font-weight:700;}

  .betrow{display:flex; gap:8px; margin-bottom:10px;}
  .betrow input{flex:1; min-width:0; background:rgba(0,0,0,.35); border:1px solid var(--line); color:#fff; border-radius:12px; padding:12px; font-size:16px; font-weight:700; outline:none;}
  .chips{display:flex; gap:6px;}
  .chips button{background:rgba(255,255,255,.08); border:1px solid var(--line); color:#cde; font-size:12px; border-radius:10px; padding:0 10px; font-weight:700;}
  .bigbtn{width:100%; border:0; border-radius:14px; padding:15px; font-size:16px; font-weight:900; color:#fff; letter-spacing:.5px; cursor:pointer; transition:transform .08s, filter .2s; background:linear-gradient(90deg,var(--pink),var(--purple)); box-shadow:0 6px 20px rgba(255,45,120,.35);}
  .bigbtn:active{transform:scale(.96);}
  .bigbtn:disabled{filter:grayscale(.8) brightness(.6);}
  .bigbtn.green{background:linear-gradient(90deg,#00c853,#00e576); box-shadow:0 6px 20px rgba(0,200,83,.35);}
  .bigbtn.gold{background:linear-gradient(90deg,#ff9800,var(--gold)); box-shadow:0 6px 20px rgba(255,201,60,.35); color:#2a1a00;}
  .bigbtn.blue{background:linear-gradient(90deg,#536DFE,#7C4DFF); box-shadow:0 6px 20px rgba(83,109,254,.4); display:flex; flex-direction:column; align-items:center; justify-content:center; gap:2px; padding:10px;}
  .bigbtn.blue span{font-size:14px; opacity:.8; font-weight:600;}
  .bigbtn.gray{ background: rgba(255,255,255,.08) !important; box-shadow: none !important; color: #888 !important; border: 1px solid rgba(255,255,255,.05); cursor: default; }
  .bigbtn.gray span { color: #666 !important; }

  .sky{position:relative; height:min(40vh,280px); border-radius:18px; overflow:hidden; margin-bottom:10px; background:radial-gradient(120% 100% at 50% 100%, #1a1040 0%, #0b0e1a 70%); border:1px solid var(--line);}
  #rocketCanvas{position:absolute; inset:0; width:100%; height:100%; display:block;}
  .mult{position:absolute; left:0; right:0; top:24px; text-align:center; font-size:48px; font-weight:900; font-variant-numeric:tabular-nums; text-shadow:0 0 24px rgba(0,229,255,.7); transition:color .2s; pointer-events:none;}
  .sub{position:absolute; left:0; right:0; top:80px; text-align:center; color:#9ab; font-size:12px; pointer-events:none;}
  
  .round-bar{display:flex; align-items:center; justify-content:space-between; gap:8px; margin-bottom:10px;}
  .bet-timer{display:flex; align-items:center; gap:5px; padding:6px 12px; border-radius:999px; background:rgba(255,255,255,.06); border:1px solid var(--line); font-size:10.5px; font-weight:900; letter-spacing:1.2px; color:#9ab;}
  .bet-timer b{color:var(--gold); font-size:14px; letter-spacing:0;}
  .bet-timer.fly{border-color:rgba(0,230,118,.4); color:var(--green); background:rgba(0,230,118,.1);}
  
  .players-header{font-size:13px; color:#9ab; font-weight:700; margin:15px 0 10px; padding:0 4px;}
  .players-list{display:flex; flex-direction:column; gap:8px;}
  .player-row{display:flex; align-items:center; gap:12px; background:rgba(255,255,255,.05); border:1px solid var(--line); border-radius:16px; padding:8px 14px; transition: background .3s, border-color .3s;}
  .player-row.cashed{background:rgba(0,230,118,.1); border-color:rgba(0,230,118,.3);}
  .p-avatar{width:40px; height:40px; border-radius:50%; display:flex; align-items:center; justify-content:center; font-weight:900; font-size:18px; color:#fff; flex-shrink:0;}
  .p-info{flex:1; display:flex; flex-direction:column; gap:2px; overflow:hidden;}
  .p-name{font-size:15px; font-weight:700; color:#fff; white-space:nowrap; overflow:hidden; text-overflow:ellipsis;}
  .p-bet{font-size:12px; color:#9ab; font-weight:600;}
  .p-result{display:flex; align-items:center; gap:12px; flex-shrink:0; text-align:right;}
  .p-mult{font-size:14px; font-weight:800; color:#9ab;}
  .p-win{font-size:15px; font-weight:900; color:#fff;}

  .grid{display:grid; grid-template-columns:repeat(5,1fr); gap:7px; margin-top:12px;}
  .cell{aspect-ratio:1; border-radius:12px; border:1px solid var(--line); background:linear-gradient(160deg,rgba(255,255,255,.10),rgba(255,255,255,.03)); font-size:22px; display:flex; align-items:center; justify-content:center;}
  .cell.gem{background:linear-gradient(160deg,#00c853,#00e57655); box-shadow:0 0 14px rgba(0,230,118,.4);}
  .cell.bomb{background:linear-gradient(160deg,#d32f2f,#ff525255); box-shadow:0 0 14px rgba(255,82,82,.4);}

  .seg{display:flex; gap:6px; margin-bottom:10px;}
  .seg button{flex:1; padding:9px 0; border-radius:10px; border:1px solid var(--line); background:rgba(255,255,255,.06); color:#cde; font-weight:800; font-size:13px;}
  .seg button.sel{background:linear-gradient(90deg,var(--purple),var(--pink)); border-color:transparent; color:#fff;}

  .upg-circle-wrap{display:flex; justify-content:center; padding:16px 0 6px;}
  .upg-circle{position:relative; width:min(62vw,238px); aspect-ratio:1; border-radius:50%; background:conic-gradient(var(--green) 0deg,#16924f 175deg,#2a1a3e 175deg,#221334 360deg); box-shadow:0 0 44px -14px rgba(0,230,118,.7);}
  .upg-needle{position:absolute; left:50%; bottom:50%; width:4px; height:calc(50% - 16px); border-radius:3px; background:linear-gradient(to top,rgba(255,255,255,.15),#fff 50%,var(--pink)); transform-origin:50% 100%; transform:translateX(-50%) rotate(0deg);}
  .upg-center{position:absolute; inset:23%; border-radius:50%; background:var(--bg); display:flex; flex-direction:column; align-items:center; justify-content:center; border:1px solid var(--line);}

  .plinko-wrap{position:relative; height:min(56vh,460px); min-height:280px; border-radius:18px; overflow:hidden; background:radial-gradient(circle at 50% 0%,rgba(0,230,118,.16),transparent 66%),#0a0e1a; border:1px solid var(--line); margin-bottom:10px;}
  #plinkoCv{width:100%; height:100%; display:block;}

  .wheelbox{position:relative; width:min(78vw,300px); height:min(78vw,300px); margin:6px auto 12px;}
  .wheelbox canvas{width:100%; height:100%;}
  .pointer{position:absolute; top:-8px; left:50%; transform:translateX(-50%); font-size:26px; filter:drop-shadow(0 0 8px #ffc93c); z-index:2;}

  .dice-num{text-align:center; font-size:56px; font-weight:900; min-height:70px; text-shadow:0 0 20px rgba(0,229,255,.6);}

  nav{position:fixed; bottom:0; left:0; right:0; width:100%; z-index:20; display:flex; background:rgba(16,19,34,.96); backdrop-filter:blur(12px); border-top:1px solid var(--line); padding:6px 4px calc(6px + env(safe-area-inset-bottom));}
  nav button{flex:1; background:none; border:0; color:#8a93a8; font-size:9px; font-weight:700; display:flex; flex-direction:column; align-items:center; gap:3px; padding:6px 0;}
  nav button span.ic{font-size:20px; filter:grayscale(1);}
  nav button.on{color:#fff;}
  nav button.on span.ic{filter:none; transform:translateY(-2px);}

  #toast{position:fixed; left:50%; bottom:110px; transform:translateX(-50%) translateY(20px); background:rgba(20,24,44,.95); border:1px solid var(--line); color:#fff; font-weight:800; padding:12px 20px; border-radius:14px; z-index:100; opacity:0; pointer-events:none; transition:.25s; text-align:center;}
  #toast.show{opacity:1; transform:translateX(-50%) translateY(0);}
  #toast.good{border-color:var(--green);} #toast.bad{border-color:var(--red);} #toast.gold{border-color:var(--gold);}

  /* ЭКРАН ВХОДА */
  #loginScreen { position: fixed; inset: 0; z-index: 100; background: rgba(11, 14, 26, 0.95); backdrop-filter: blur(20px); display: flex; align-items: center; justify-content: center; padding: 20px; }
  .login-box { background: var(--card); border: 1px solid var(--line); padding: 30px 20px; border-radius: 24px; width: 100%; max-width: 340px; box-shadow: 0 10px 40px rgba(0,0,0,0.5); text-align: center; }
  .login-tabs { display: flex; margin-bottom: 20px; background: rgba(0,0,0,0.3); border-radius: 12px; padding: 4px; }
  .login-tabs button { flex: 1; background: none; border: none; color: #9ab; padding: 10px; font-weight: 800; cursor: pointer; border-radius: 8px; transition: 0.3s; }
  .login-tabs button.active { background: var(--purple); color: #fff; }
  .login-box input { width: 100%; padding: 15px; border-radius: 12px; border: 1px solid var(--line); background: rgba(0,0,0,0.4); color: #fff; font-size: 16px; font-weight: 700; margin-bottom: 12px; outline: none; text-align: center; }

  /* МОДАЛКА АДМИНА */
  #adminModal { position: fixed; inset: 0; z-index: 90; background: rgba(0,0,0,0.8); backdrop-filter: blur(10px); display: none; align-items: center; justify-content: center; padding: 20px; }
  .admin-box { background: #111624; border: 1px solid var(--line); border-radius: 20px; width: 100%; max-width: 400px; padding: 20px; max-height: 80vh; display: flex; flex-direction: column; }
  .admin-list { flex: 1; overflow-y: auto; background: rgba(0,0,0,0.3); border-radius: 12px; padding: 10px; margin-bottom: 15px; max-height: 200px; }
  .admin-user { display: flex; justify-content: space-between; padding: 8px; border-bottom: 1px solid var(--line); font-size: 13px; cursor: pointer; }
  .admin-user:active { background: rgba(255,255,255,0.1); }
  .admin-inputs { display: flex; gap: 8px; margin-bottom: 10px; }
</style>
</head>
<body>
<div class="blob b1"></div><div class="blob b2"></div><div class="blob b3"></div>

<!-- ЭКРАН ВХОДА / РЕГИСТРАЦИИ -->
<div id="loginScreen">
  <div class="login-box">
    <div style="font-size: 40px; margin-bottom: 10px;">🎰</div>
    <div class="login-tabs">
      <button id="tabLogin" class="active" onclick="switchAuthTab('login')">ВХОД</button>
      <button id="tabReg" onclick="switchAuthTab('reg')">РЕГИСТРАЦИЯ</button>
    </div>
    <input type="text" id="authUser" placeholder="Логин (ник)" maxlength="15">
    <input type="password" id="authPass" placeholder="Пароль">
    <button class="bigbtn blue" id="authBtn" onclick="submitAuth()">ВОЙТИ</button>
  </div>
</div>

<!-- МОДАЛКА АДМИНА -->
<div id="adminModal" onclick="if(event.target===this)this.style.display='none'">
  <div class="admin-box">
    <h3 style="margin-top:0; text-align:center; color:var(--gold);">👑 АДМИН-ПАНЕЛЬ</h3>
    <p style="font-size:12px; color:#9ab; text-align:center; margin-bottom:10px;">Нажми на игрока, чтобы выбрать</p>
    
    <div class="admin-list" id="adminUsersList">Загрузка...</div>
    
    <input type="text" id="adminTarget" placeholder="Ник игрока" style="width:100%; padding:10px; margin-bottom:8px; border-radius:8px; border:1px solid var(--line); background:#2a2e3e; color:#fff;">
    <div class="admin-inputs">
      <input type="number" id="adminAmount" value="1000" style="flex:1; padding:10px; border-radius:8px; border:1px solid var(--line); background:#2a2e3e; color:#fff;">
      <button class="bigbtn green" style="width:100px; padding:10px;" onclick="adminAction('add')">+ Дать</button>
    </div>
    <button class="bigbtn" style="padding:10px; margin-top:5px;" onclick="adminAction('set')">Установить баланс</button>
    <button class="bigbtn gray" style="padding:10px; margin-top:10px;" onclick="document.getElementById('adminModal').style.display='none'">Закрыть</button>
  </div>
</div>

<div id="app">
  <header>
    <div class="logo" onclick="tab('menu', document.querySelector('nav button[data-g=\'menu\']'))">СИМУЛЯТОР<br>ЛУДОМАНИИ<small>ТОЛЬКО ФАН</small></div>
    <div class="head-right">
      <div class="balance-wrap">
        <div class="balance" id="balance">...</div>
        <button class="topup-btn" onclick="addFunds()">+</button>
      </div>
    </div>
  </header>

  <main>
    <section class="game on" id="g-menu">
      <div class="menu-title">ВЫБЕРИ ИГРУ</div>
      <div class="menu-grid">
        <button class="menu-card" style="--c1:#7c1a47; --c2:#ff2d78;" onclick="tab('rocket', document.querySelector('nav button[data-g=\'rocket\']'))"><div class="menu-live"><div class="dot"></div><span id="m-online-rocket">…</span></div><div class="icon">🚀</div><div class="title">Ракетка</div></button>
        <button class="menu-card" style="--c1:#1a0b2e; --c2:#ff6b00;" onclick="tab('mines', document.querySelector('nav button[data-g=\'mines\']'))"><div class="menu-live"><div class="dot"></div><span id="m-online-mines">…</span></div><div class="icon">💣</div><div class="title">Мины</div></button>
        <button class="menu-card" style="--c1:#8b6900; --c2:#ffc93c;" onclick="tab('up', document.querySelector('nav button[data-g=\'up\']'))"><div class="menu-live"><div class="dot"></div><span id="m-online-up">…</span></div><div class="icon">⚡</div><div class="title">Апгрейд</div></button>
        <button class="menu-card" style="--c1:#0b4a52; --c2:#00e5ff;" onclick="tab('dice', document.querySelector('nav button[data-g=\'dice\']'))"><div class="menu-live"><div class="dot"></div><span id="m-online-dice">…</span></div><div class="icon">🎲</div><div class="title">Кости</div></button>
        <button class="menu-card" style="--c1:#5c0b11; --c2:#ff5252;" onclick="tab('wheel', document.querySelector('nav button[data-g=\'wheel\']'))"><div class="menu-live"><div class="dot"></div><span id="m-online-wheel">…</span></div><div class="icon">🎡</div><div class="title">Колесо</div></button>
        <button class="menu-card" style="--c1:#0a3b1f; --c2:#00e676;" onclick="tab('plinko', document.querySelector('nav button[data-g=\'plinko\']'))"><div class="menu-live"><div class="dot"></div><span id="m-online-plinko">…</span></div><div class="icon">🔻</div><div class="title">Плинко</div></button>
      </div>
    </section>

    <!-- РАКЕТКА -->
    <section class="game" id="g-rocket">
      <div class="sky">
        <canvas id="rocketCanvas"></canvas>
        <div class="mult" id="cMult">1.00x</div>
        <div class="sub" id="cSub">Ждём ставки…</div>
      </div>
      <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:10px;">
        <div class="live-badge"><div class="live-dot"></div><span id="online-rocket">0</span> онлайн</div>
      </div>
      <button class="bigbtn blue" id="rocketBtn" onclick="rocketClick()"><div style="font-size:16px; font-weight:900;">СДЕЛАТЬ СТАВКУ</div></button>
      <div class="panel" style="margin-top:12px;">
        <div class="round-bar">
          <div class="bet-timer" id="rocketTimer">⏱ СТАВКИ · <b>8с</b></div>
        </div>
        <div class="betrow">
          <input type="number" id="rocketBet" value="100" min="1" inputmode="decimal">
          <div class="chips">
            <button onclick="chip('rocketBet',10)">10</button>
            <button onclick="chip('rocketBet',100)">100</button>
            <button onclick="chip('rocketBet',500)">500</button>
            <button onclick="half('rocketBet')">½</button>
            <button onclick="dbl('rocketBet')">x2</button>
          </div>
        </div>
        <div class="players-header">Игроков <b id="pCount">0</b> · банк <b id="pBank">0</b> Р</div>
        <div class="players-list" id="playersList"></div>
      </div>
    </section>

    <!-- МИНЫ -->
    <section class="game" id="g-mines">
      <div class="panel">
        <div class="seg" id="mineSeg">
          <button data-m="1" onclick="minePick(1,this)">1</button>
          <button data-m="3" class="sel" onclick="minePick(3,this)">3</button>
          <button data-m="5" onclick="minePick(5,this)">5</button>
          <button data-m="10" onclick="minePick(10,this)">10</button>
        </div>
        <div class="betrow">
          <input type="number" id="minesBet" value="100" min="1">
          <div class="chips"><button onclick="half('minesBet')">½</button><button onclick="dbl('minesBet')">x2</button></div>
        </div>
        <div class="row" style="display:flex; justify-content:space-between; margin-bottom:10px;">Множитель: <b id="mMult">1.00x</b></div>
        <button class="bigbtn" id="minesBtn" onclick="minesStart()">💣 ИГРАТЬ</button>
        <button class="bigbtn gold" id="minesCash" style="margin-top:8px; display:none" onclick="minesCash()">ЗАБРАТЬ</button>
        <div class="grid" id="mGrid"></div>
      </div>
    </section>

    <!-- АПГРЕЙДЕР -->
    <section class="game" id="g-up">
      <div class="panel">
        <div style="display:flex; gap:10px; margin-bottom:15px;">
          <input type="number" id="upBet" value="100" style="width:50%; padding:10px; border-radius:8px; background:#111; color:#fff; border:1px solid #333;">
          <input type="number" id="upWin" value="200" style="width:50%; padding:10px; border-radius:8px; background:#111; color:#fff; border:1px solid #333;">
        </div>
        <div class="upg-circle-wrap">
          <div class="upg-circle" id="upCircle">
            <div class="upg-needle" id="upNeedle"></div>
            <div class="upg-center">
              <div class="upg-pct" id="upPct" style="font-size:24px; font-weight:900;">48%</div>
              <div style="font-size:10px; color:#9ab;">ШАНС</div>
            </div>
          </div>
        </div>
        <button class="bigbtn" id="upBtn" onclick="upStart()" style="margin-top:15px;">⚡ АПГРЕЙДНУТЬ</button>
      </div>
    </section>

    <!-- КОСТИ -->
    <section class="game" id="g-dice">
      <div class="panel">
        <div class="dice-num" id="diceNum">50.00</div>
        <div class="seg">
          <button id="dOver" class="sel" onclick="diceMode('over')">БОЛЬШЕ ▲</button>
          <button id="dUnder" onclick="diceMode('under')">МЕНЬШЕ ▼</button>
        </div>
        <input type="range" id="dTarget" min="2" max="98" value="50" oninput="diceRender()" style="width:100%; margin-bottom:15px;">
        <div class="betrow">
          <input type="number" id="diceBet" value="100">
        </div>
        <button class="bigbtn" id="diceBtn" onclick="diceRoll()">🎲 БРОСИТЬ</button>
      </div>
    </section>

    <!-- КОЛЕСО -->
    <section class="game" id="g-wheel">
      <div class="panel" style="text-align:center">
        <div class="wheelbox">
          <div class="pointer">▼</div>
          <canvas id="wheelCv" width="540" height="540"></canvas>
        </div>
        <div class="wres" id="wRes" style="height:30px; font-weight:900; margin-bottom:10px;"></div>
        <div class="betrow">
          <input type="number" id="wheelBet" value="100">
        </div>
        <button class="bigbtn gold" id="wheelBtn" onclick="wheelSpin()">🎡 КРУТИТЬ</button>
      </div>
    </section>

    <!-- ПЛИНКО -->
    <section class="game" id="g-plinko">
      <div class="plinko-wrap">
        <canvas id="plinkoCv"></canvas>
      </div>
      <div class="panel">
        <div class="betrow">
          <input type="number" id="plinkoBet" value="100">
        </div>
        <button class="bigbtn green" id="plinkoBtn" onclick="plinkoDrop()">🔻 БРОСИТЬ ШАРИК</button>
      </div>
    </section>
  </main>

  <nav>
    <button class="on" data-g="menu" onclick="tab('menu',this)"><span class="ic">🏠</span>Меню</button>
    <button data-g="rocket" onclick="tab('rocket',this)"><span class="ic">🚀</span>Ракетка</button>
    <button data-g="mines" onclick="tab('mines',this)"><span class="ic">💣</span>Мины</button>
    <button data-g="up" onclick="tab('up',this)"><span class="ic">⚡</span>Апгрейд</button>
    <button data-g="dice" onclick="tab('dice',this)"><span class="ic">🎲</span>Кости</button>
    <button data-g="wheel" onclick="tab('wheel',this)"><span class="ic">🎡</span>Колесо</button>
    <button data-g="plinko" onclick="tab('plinko',this)"><span class="ic">🔻</span>Плинко</button>
  </nav>
  <div id="toast"></div>
</div>

<script src="https://cdn.socket.io/4.8.4/socket.io.min.js"></script>
<script>
'use strict';

const socket = io();
const S = { bal: 0, isAdmin: false, authMode: 'login' };
const fmt = n => n.toLocaleString('ru-RU',{maximumFractionDigits:2});

function switchAuthTab(mode) {
  S.authMode = mode;
  document.getElementById('tabLogin').classList.toggle('active', mode === 'login');
  document.getElementById('tabReg').classList.toggle('active', mode === 'reg');
  document.getElementById('authBtn').textContent = mode === 'login' ? 'ВОЙТИ' : 'ЗАРЕГИСТРИРОВАТЬСЯ';
}

function submitAuth() {
  const u = document.getElementById('authUser').value.trim();
  const p = document.getElementById('authPass').value;
  if(!u || !p) return toast('Заполните все поля', 'bad');
  
  if(S.authMode === 'login') socket.emit('login', { username: u, password: p });
  else socket.emit('register', { username: u, password: p });
}

function setBal(v){
  S.bal = v;
  const el = document.getElementById('balance');
  el.textContent = fmt(S.bal);
  el.classList.add('pop');
  setTimeout(()=>el.classList.remove('pop'),200);
}

function toast(msg,type){
  const t=document.getElementById('toast');
  t.textContent=msg; t.className='show '+(type||'');
  clearTimeout(t._t); t._t=setTimeout(()=>t.className='',2400);
}

function addFunds(){ 
  if(S.isAdmin) {
    document.getElementById('adminModal').style.display = 'flex';
    socket.emit('admin_get_users');
  } else {
    toast('Попросите администратора пополнить баланс!', 'bad'); 
  }
}

function adminAction(action) {
  const target = document.getElementById('adminTarget').value.trim();
  const amount = document.getElementById('adminAmount').value;
  if(!target) return toast('Введите ник', 'bad');
  socket.emit('admin_change_balance', { targetName: target, amount, action });
}

socket.on('admin_users_list', (list) => {
  const box = document.getElementById('adminUsersList');
  box.innerHTML = '';
  list.forEach(u => {
    const div = document.createElement('div');
    div.className = 'admin-user';
    div.innerHTML = `<span>${u.name}</span> <span style="color:var(--gold)">${fmt(u.balance)} Р</span>`;
    div.onclick = () => document.getElementById('adminTarget').value = u.name;
    box.appendChild(div);
  });
});

socket.on('auth_error', (msg) => toast(msg, 'bad'));

socket.on('login_success', (data) => {
  document.getElementById('loginScreen').style.display = 'none';
  document.getElementById('app').style.display = 'flex';
  setBal(data.balance);
  S.isAdmin = data.isAdmin;
  toast('Привет, ' + data.username + '!', 'good');
  setTimeout(() => { rocketResize(); plinkoGeometry(); }, 100); 
});

// НАВИГАЦИЯ
function tab(g,btn){
  document.querySelectorAll('.game').forEach(s=>s.classList.remove('on'));
  document.getElementById('g-'+g).classList.add('on');
  document.querySelectorAll('nav button').forEach(b=>b.classList.remove('on'));
  if(btn) btn.classList.add('on');
  if(g==='rocket') setTimeout(rocketResize,40);
  if(g==='plinko'){ requestAnimationFrame(()=>requestAnimationFrame(()=>plinkoGeometry())); setTimeout(plinkoGeometry, 60); }
}
function chip(id,v){ document.getElementById(id).value=v; }
function half(id){ const i=document.getElementById(id); i.value=Math.max(1,Math.floor((i.value||0)/2)); }
function dbl(id){ const i=document.getElementById(id); i.value=Math.min(Math.max(S.bal,1),Math.round((i.value||0)*2*100)/100); }
function readBet(id){
  let v = parseFloat(document.getElementById(id).value);
  if(!v || v<=0){ toast('Ставка должна быть больше нуля','bad'); return 0; }
  if(v > S.bal){ toast('Недостаточно рублей 💸','bad'); return 0; }
  return Math.round(v*100)/100;
}

// РАКЕТКА
const rkCv = document.getElementById('rocketCanvas');
const rkCtx = rkCv.getContext('2d');
let rkW = 0, rkH = 0;
const RK = { phase:'waiting', mult:1, pts:[], playersData:[], myBet:0, cashedOut:false };

function rocketResize(){
  const rect = rkCv.getBoundingClientRect();
  if(!rect.width || !rect.height) return;
  const dpr = Math.min(window.devicePixelRatio||1, 2);
  rkCv.width = Math.round(rect.width*dpr); rkCv.height = Math.round(rect.height*dpr);
  rkW = rect.width; rkH = rect.height;
  rkCtx.setTransform(dpr,0,0,dpr,0,0); rocketDraw();
}

function rocketDraw(boom){
  if(!rkW) return;
  const ctx = rkCtx; ctx.clearRect(0,0,rkW,rkH);
  ctx.strokeStyle='rgba(124,77,255,.10)'; ctx.lineWidth=1;
  for(let x=0;x<rkW;x+=32){ ctx.beginPath(); ctx.moveTo(x,0); ctx.lineTo(x,rkH); ctx.stroke(); }
  for(let y=0;y<rkH;y+=32){ ctx.beginPath(); ctx.moveTo(0,y); ctx.lineTo(rkW,y); ctx.stroke(); }

  if(RK.pts.length>1){
    const maxT = Math.max(4, RK.pts[RK.pts.length-1].t);
    const maxM = Math.max(2, RK.mult);
    const logMax = Math.log(maxM);
    const px = t => 18 + (t/maxT)*(rkW-44);
    const py = m => (rkH-26) - (Math.log(Math.max(1,m))/logMax)*(rkH-82);

    ctx.beginPath(); ctx.moveTo(px(RK.pts[0].t), py(RK.pts[0].m));
    for(let i=1;i<RK.pts.length;i++) ctx.lineTo(px(RK.pts[i].t), py(RK.pts[i].m));
    ctx.lineTo(px(RK.pts[RK.pts.length-1].t), rkH-26); ctx.lineTo(px(RK.pts[0].t), rkH-26); ctx.closePath();
    const g = ctx.createLinearGradient(0,0,0,rkH);
    g.addColorStop(0, boom?'rgba(255,82,82,.45)':'rgba(255,45,120,.45)'); g.addColorStop(1, 'rgba(255,45,120,0)'); ctx.fillStyle = g; ctx.fill();

    ctx.beginPath(); ctx.moveTo(px(RK.pts[0].t), py(RK.pts[0].m));
    for(let i=1;i<RK.pts.length;i++) ctx.lineTo(px(RK.pts[i].t), py(RK.pts[i].m));
    ctx.strokeStyle = boom?'#ff5252':'#ff2d78'; ctx.lineWidth=3.5; ctx.stroke();
    ctx.font='24px serif'; ctx.textAlign='center'; ctx.fillText(boom?'💥':'🚀', px(RK.pts[RK.pts.length-1].t), py(RK.pts[RK.pts.length-1].m));
  }
}

function renderPlayers(){
  const list = document.getElementById('playersList');
  let totalBank = 0; list.innerHTML = '';
  RK.playersData.forEach(p => {
    totalBank += p.bet;
    const row = document.createElement('div'); row.className = 'player-row';
    let multText = p.cashedOut ? 'x' + p.cashoutMult.toFixed(2) : 'x' + RK.mult.toFixed(2);
    let winText = p.cashedOut ? fmt(p.bet * p.cashoutMult) + ' Р' : (RK.phase === 'flying' ? fmt(p.bet * RK.mult) + ' Р' : p.bet + ' Р');
    row.innerHTML = `<div class="p-avatar" style="background:${p.cashedOut?'#00e676':'#7c4dff'}">${p.name[0]}</div>
      <div class="p-info"><div class="p-name">${p.name}</div><div class="p-bet">${fmt(p.bet)} Р</div></div>
      <div class="p-result"><div class="p-mult">${multText}</div><div class="p-win">${winText}</div></div>`;
    list.appendChild(row);
  });
  document.getElementById('pCount').textContent = RK.playersData.length;
  document.getElementById('pBank').textContent = fmt(totalBank);
}

function rocketUpdateUI(){
  const btn = document.getElementById('rocketBtn');
  btn.className = 'bigbtn'; btn.disabled = false;
  if(RK.phase === 'waiting'){
    if(RK.myBet > 0){ btn.innerHTML = `СТАВКА ПРИНЯТА (${fmt(RK.myBet)} Р)`; btn.classList.add('gray'); btn.disabled = true; }
    else { btn.innerHTML = `СДЕЛАТЬ СТАВКУ`; btn.classList.add('blue'); }
    return;
  }
  if(RK.phase === 'flying'){
    if(RK.myBet > 0 && !RK.cashedOut){ btn.innerHTML = `💰 ЗАБРАТЬ ${RK.mult.toFixed(2)}x (${fmt(RK.myBet * RK.mult)} Р)`; btn.classList.add('green'); }
    else if(RK.myBet > 0 && RK.cashedOut){ btn.innerHTML = `ЗАБРАНО ✅`; btn.classList.add('gray'); btn.disabled = true; }
    else { btn.innerHTML = `СТАВКА НА СЛЕД. РАУНД`; btn.classList.add('blue'); }
    return;
  }
  btn.innerHTML = `СТАВКА НА СЛЕД. РАУНД`; btn.classList.add('blue');
}

function rocketClick(){
  const bet = Math.max(1, Math.floor(parseFloat(document.getElementById('rocketBet').value)||1));
  if(RK.phase === 'waiting' && RK.myBet === 0) socket.emit('place_bet', bet);
  else if (RK.phase === 'flying' && RK.myBet > 0 && !RK.cashedOut) socket.emit('cash_out');
  else if (RK.phase !== 'waiting' && RK.myBet === 0) socket.emit('place_bet', bet);
}

socket.on('balance_update', (bal) => setBal(bal));

socket.on('game_state', (state) => {
  RK.phase = state.phase; RK.mult = state.multiplier;
  const tEl = document.getElementById('rocketTimer');
  if (RK.phase === 'waiting') { tEl.innerHTML = `⏱ СТАВКИ · <b>${state.timeLeft}с</b>`; tEl.classList.remove('fly'); document.getElementById('cMult').textContent = '1.00x'; document.getElementById('cSub').textContent = 'Ставки открыты'; RK.pts = []; }
  else if (RK.phase === 'flying') { tEl.innerHTML = '🚀 В ПОЛЁТЕ'; tEl.classList.add('fly'); document.getElementById('cSub').textContent = 'Забирай!'; RK.pts = [{t:0, m:1}]; }
  else if (RK.phase === 'crashed') { tEl.innerHTML = 'КРАШ!'; tEl.classList.remove('fly'); document.getElementById('cSub').textContent = 'Ждём след. раунд...'; }
  rocketUpdateUI();
});

socket.on('multiplier_update', (mult) => {
  RK.mult = mult;
  if (RK.phase !== 'flying') return;
  RK.pts.push({ t: Math.log(mult) / 0.42, m: mult });
  const mEl = document.getElementById('cMult');
  mEl.textContent = mult.toFixed(2) + 'x';
  if(RK.myBet > 0 && !RK.cashedOut) document.getElementById('rocketBtn').innerHTML = `💰 ЗАБРАТЬ ${mult.toFixed(2)}x (${fmt(RK.myBet * mult)} Р)`;
  rocketDraw(); renderPlayers();
});

socket.on('game_crash', (data) => {
  RK.phase = 'crashed'; rocketDraw(true);
  document.getElementById('cMult').textContent = data.crashAt.toFixed(2) + 'x 💥';
  RK.myBet = 0; RK.cashedOut = false; rocketUpdateUI();
});

socket.on('players_update', (data) => { RK.playersData = data.players; renderPlayers(); rocketUpdateUI(); });
socket.on('cashout_success', (data) => { toast('💰 Забрал ' + fmt(data.win) + ' Р', 'gold'); RK.cashedOut = true; rocketUpdateUI(); });
socket.on('toast', (data) => toast(data.msg, data.type));


// МИНЫ
let M = { mineCount:3, active:false }; const GRID_N = 25;
function minePick(m,btn){ if(M.active) return; M.mineCount = m; document.querySelectorAll('#mineSeg button').forEach(b=>b.classList.remove('sel')); btn.classList.add('sel'); }
function minesMult(k,m){ let p=1; for(let i=0;i<k;i++) p *= (GRID_N-i)/(GRID_N-m-i); return p*0.97; }
function minesStart(){
  if(M.active) return; const bet = readBet('minesBet'); if(!bet) return; setBal(S.bal - bet);
  M = { mineCount:M.mineCount, active:true, bet, mines:new Set(), opened:new Set() };
  while(M.mines.size < M.mineCount) M.mines.add(Math.floor(Math.random()*GRID_N));
  const g = document.getElementById('mGrid'); g.innerHTML='';
  for(let i=0;i<GRID_N;i++){ const c=document.createElement('button'); c.className='cell'; c.onclick=()=>mineClick(i); g.appendChild(c); }
  document.getElementById('minesBtn').style.display='none'; document.getElementById('minesCash').style.display='block'; document.getElementById('minesCash').textContent='ЗАБРАТЬ '+fmt(bet)+' Р';
}
function mineClick(i){
  if(!M.active || M.opened.has(i)) return; const cells = document.getElementById('mGrid').children;
  if(M.mines.has(i)){ cells[i].textContent='💣'; cells[i].className='cell bomb'; M.active=false; toast('💥 Мина!','bad'); document.getElementById('minesCash').style.display='none'; document.getElementById('minesBtn').style.display='block'; return; }
  M.opened.add(i); cells[i].textContent='💎'; cells[i].className='cell gem';
  const mult = minesMult(M.opened.size, M.mineCount); document.getElementById('mMult').textContent = mult.toFixed(2)+'x'; document.getElementById('minesCash').textContent = 'ЗАБРАТЬ '+fmt(M.bet*mult)+' Р';
}
function minesCash(){ if(!M.active) return; const win = M.bet*minesMult(M.opened.size, M.mineCount); M.active=false; setBal(S.bal + win); document.getElementById('minesCash').style.display='none'; document.getElementById('minesBtn').style.display='block'; toast('💰 Забрал '+fmt(win)+' Р','gold'); }

// АПГРЕЙД
let upBusy = false, upAngle = 0;
function upRender(){ const b = Math.max(1, parseFloat(document.getElementById('upBet').value)); const w = Math.max(b+1, parseFloat(document.getElementById('upWin').value)); const c = Math.min(0.97, 0.97/(w/b)); document.getElementById('upCircle').style.background = `conic-gradient(var(--green) 0deg, #16924f ${c*360}deg, #2a1a3e ${c*360}deg, #221334 360deg)`; document.getElementById('upPct').textContent = (c*100).toFixed(1)+'%'; }
document.getElementById('upBet').addEventListener('input', upRender); document.getElementById('upWin').addEventListener('input', upRender); upRender();
function upStart(){
  if(upBusy) return; const b = parseFloat(document.getElementById('upBet').value), w = parseFloat(document.getElementById('upWin').value);
  const c = Math.min(0.97, 0.97/(w/b)); if(S.bal < b) return toast('Мало денег','bad');
  setBal(S.bal - b); upBusy = true; document.getElementById('upBtn').disabled = true;
  const target = upAngle + 360*5 + (Math.random()*360); const from = upAngle; const t0 = performance.now();
  function anim(now){
    const p = Math.min(1, (now-t0)/2600); upAngle = from + (target-from)*(1-Math.pow(1-p,3)); document.getElementById('upNeedle').style.transform = `translateX(-50%) rotate(${upAngle}deg)`;
    if(p<1) return requestAnimationFrame(anim);
    upBusy = false; document.getElementById('upBtn').disabled = false;
    if((upAngle%360)/360 < c){ setBal(S.bal + w); toast('⚡ Апгрейд! +'+fmt(w),'good'); } else toast('⚡ Мимо','bad');
  } requestAnimationFrame(anim);
}

// КОСТИ
let D = { mode:'over', busy:false };
function diceMode(m){ D.mode=m; document.getElementById('dOver').classList.toggle('sel', m==='over'); document.getElementById('dUnder').classList.toggle('sel', m==='under'); }
function diceRoll(){
  if(D.busy) return; const b = readBet('diceBet'); if(!b) return; setBal(S.bal - b); D.busy = true;
  const t = +document.getElementById('dTarget').value; const c = D.mode==='over' ? 100-t : t; const r = Math.random()*100;
  document.getElementById('diceNum').textContent = r.toFixed(2);
  setTimeout(()=>{ if(D.mode==='over' ? r>t : r<t){ setBal(S.bal + b*(95/c)); toast('Победа!','good'); } else toast('Проигрыш','bad'); D.busy=false; }, 1000);
}

// КОЛЕСО
const SEGS = [0,1.5,0,3,1.5,5,0,2,10,1.5]; let wheelRot = 0, wheelBusy = false;
function drawWheel(){
  const ctx = document.getElementById('wheelCv').getContext('2d'); ctx.clearRect(0,0,540,540); ctx.save(); ctx.translate(270,270); ctx.rotate(wheelRot*Math.PI/180);
  SEGS.forEach((m,i)=>{ ctx.beginPath(); ctx.moveTo(0,0); ctx.arc(0,0,250, (i*36-108)*Math.PI/180, (i*36-72)*Math.PI/180); ctx.fillStyle = m===0?'#d32f2f':'#7c4dff'; ctx.fill(); ctx.fillStyle='#fff'; ctx.font='20px Arial'; ctx.fillText(m+'x', 150, 0); ctx.rotate(36*Math.PI/180); });
  ctx.restore();
} drawWheel();
function wheelSpin(){
  if(wheelBusy) return; const b = readBet('wheelBet'); if(!b) return; setBal(S.bal - b); wheelBusy = true;
  const idx = Math.floor(Math.random()*SEGS.length); const target = wheelRot + 360*5 + (360 - idx*36); const from = wheelRot;
  const t0 = performance.now(); function anim(now){
    const p = Math.min(1,(now-t0)/3000); wheelRot = from + (target-from)*(1-Math.pow(1-p,3)); drawWheel();
    if(p<1) return requestAnimationFrame(anim);
    wheelRot = target%360; const m = SEGS[idx]; if(m>0){ setBal(S.bal + b*m); toast('Выпало '+m+'x!','gold'); } else toast('Пусто','bad'); wheelBusy = false;
  } requestAnimationFrame(anim);
}

// ПЛИНКО
const PL_ROWS = 10; const PL_MULT = [32,16,8,4,2,0,2,4,8,16,32]; let plW=0, plH=0, plSpacing=0, plPadT=0, plRowH=0;
function plinkoGeometry(){
  const cv = document.getElementById('plinkoCv'); if(!cv) return; const wrap = cv.parentElement; const r = cv.getBoundingClientRect();
  let w = r.width || wrap.clientWidth; let h = r.height || wrap.clientHeight;
  if(!w || !h) return; cv.width=w; cv.height=h; plW=w; plH=h;
  const padX = 16; plSpacing = (plW - padX*2)/(PL_ROWS+1); plPadT = 26; plRowH = (plH - plPadT - 56)/PL_ROWS;
  plinkoDraw();
}
function plinkoDraw(){
  if(!plW || !plH) return; const ctx = document.getElementById('plinkoCv').getContext('2d'); ctx.clearRect(0,0,plW,plH);
  for(let r=0;r<PL_ROWS;r++) for(let c=0;c<=r;c++){ const x=plW/2+(c-r/2)*plSpacing; const y=plPadT+r*plRowH; ctx.beginPath(); ctx.arc(x,y,2.5,0,Math.PI*2); ctx.fillStyle='#fff'; ctx.fill(); }
  const slotW = plSpacing*0.92; const slotY = plPadT + PL_ROWS*plRowH + 12;
  for(let j=0;j<=PL_ROWS;j++){
    const m = PL_MULT[j]; const x = plW/2 + (j - PL_ROWS/2)*plSpacing; const l = x - slotW/2;
    ctx.fillStyle = m===0?'#3a1e2a':'#1f6b4a'; ctx.beginPath(); ctx.roundRect(l, slotY, slotW, 34, 9); ctx.fill();
    ctx.fillStyle = '#fff'; ctx.font = 'bold 12px sans-serif'; ctx.textAlign='center'; ctx.textBaseline='middle'; ctx.fillText(m+'x', x, slotY+17);
  }
}
function plinkoDrop(){
  const b = readBet('plinkoBet'); if(!b) return; setBal(S.bal - b);
  let j = 0; const pts = [{x: plW/2, y: plPadT - 18}];
  for(let s=1;s<=PL_ROWS;s++){ j += Math.random()<0.5?0:1; pts.push({x: plW/2+(j-s/2)*plSpacing, y: plPadT+(s-1)*plRowH}); }
  const slot = j; pts.push({x: plW/2+(j-PL_ROWS/2)*plSpacing, y: plPadT+PL_ROWS*plRowH+10});
  const t0 = performance.now(), dur = 2000;
  function anim(now){
    const p = Math.min(1,(now-t0)/dur); const fp = p*(pts.length-1); const i = Math.min(pts.length-2, Math.floor(fp)); const f = fp-i;
    const x = pts[i].x + (pts[i+1].x-pts[i].x)*f; const y = pts[i].y + (pts[i+1].y-pts[i].y)*f;
    plinkoDraw(); const ctx = document.getElementById('plinkoCv').getContext('2d');
    ctx.beginPath(); ctx.arc(x,y,6,0,Math.PI*2); ctx.fillStyle='#ffc93c'; ctx.shadowBlur=15; ctx.shadowColor='#ffc93c'; ctx.fill(); ctx.shadowBlur=0;
    if(p<1) return requestAnimationFrame(anim);
    const mult = PL_MULT[slot]; if(mult>0){ setBal(S.bal + b*mult); toast('+'+fmt(b*mult)+' Р ('+mult+'x)','gold'); } else toast('0x','bad'); plinkoDraw();
  } requestAnimationFrame(anim);
}

window.addEventListener('resize', ()=>{ rocketResize(); plinkoGeometry(); });
setTimeout(()=>{ rocketResize(); plinkoGeometry(); }, 200);
</script>
